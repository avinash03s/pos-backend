spring.application.name=yantra-POS

server.port=9000


## AWS Secrets Manager

spring.datasource.url=jdbc:postgresql://localhost:5432/yantra_pos_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# JWT
jwt.secret=${JWT_SECRET}

# Gmail SMTP (use App Password if 2FA enabled)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n


product.name.required=Product name is required
product.sku.required=Product SKU is required
product.sku.duplicate=A product with this SKU already exists
product.not.found=Product not found
category.not.found=Category not found